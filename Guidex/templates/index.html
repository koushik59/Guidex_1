<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuideX - AI Navigation Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDsIVIzXFVHIgnfcT0i88PCGlS9GdAm9pQ&libraries=places"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="main-header">
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon">👁️</div>
                    <div class="logo-text">
                        <h1>GuideX</h1>
                        <span class="tagline">AI Navigation Assistant</span>
                    </div>
                </div>
            </div>

            <div class="header-center">
                <span id="statusText" class="status-indicator"><span class="status-dot"></span>System Ready</span>
            </div>

            <div class="header-right">
                <select id="languageSelect" class="lang-select" aria-label="Select Language">
                    <option value="en">🇬🇧 English</option>
                    <option value="hi">🇮🇳 हिन्दी</option>
                    <option value="te">🇮🇳 తెలుగు</option>
                </select>
            </div>
        </header>

        <!-- Main Content Grid -->
        <div class="main-grid">
            <!-- Left Panel: Map -->
            <section class="map-panel">
                <div class="map-header">
                    <h2><i class="fas fa-map"></i> Live Location</h2>
                </div>
                <div id="map" class="map-container"></div>
                <div class="map-controls">
                    <button id="centerMapBtn" class="control-btn" title="Center Map">
                        <i class="fas fa-compass"></i>
                    </button>
                    <button id="toggleMapBtn" class="control-btn" title="Satellite View">
                        <i class="fas fa-satellite"></i>
                    </button>
                </div>
            </section>

            <!-- Center Panel: Camera & Detection -->
            <section class="camera-panel">
                <div class="camera-header">
                    <h2><i class="fas fa-camera"></i> Live Camera</h2>
                    <div class="camera-status" id="cameraStatus">
                        <span class="dot"></span>
                        <span id="cameraStatusText">Inactive</span>
                    </div>
                </div>
                <div class="camera-feed-container">
                    <img id="videoFeed" src="#" alt="Camera Feed" class="camera-feed">
                    <div class="feed-overlay">
                        <div id="detectionInfo" class="detection-info">
                            <div id="detectionCount" class="info-item">
                                <span class="label">Objects:</span>
                                <span class="value">0</span>
                            </div>
                            <div id="faceCount" class="info-item">
                                <span class="label">Faces:</span>
                                <span class="value">0</span>
                            </div>
                            <div id="textCount" class="info-item">
                                <span class="label">Text:</span>
                                <span class="value">None</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Control Buttons -->
                <div class="button-group">
                    <button id="startNavBtn" class="btn btn-primary" onclick="startNavigation()">
                        <i class="fas fa-play"></i> Start Navigation
                    </button>
                    <button id="stopNavBtn" class="btn btn-danger" onclick="stopNavigation()" disabled>
                        <i class="fas fa-stop"></i> Stop Navigation
                    </button>
                </div>
            </section>

            <!-- Right Panel: Features & Voice -->
            <section class="features-panel">
                <!-- Voice Assistant -->
                <div class="feature-card">
                    <div class="card-header">
                        <h3><i class="fas fa-microphone"></i> Voice Assistant</h3>
                    </div>
                    <div class="card-body">
                        <button id="voiceBtn" class="voice-button" onclick="toggleVoice()">
                            <i class="fas fa-microphone"></i>
                            <span id="voiceText">Click to Speak</span>
                        </button>
                        <div id="voiceStatus" class="voice-status"></div>
                    </div>
                </div>

                <!-- Face Recognition -->
                <div class="feature-card">
                    <div class="card-header">
                        <h3><i class="fas fa-face-smile"></i> Face Recognition</h3>
                    </div>
                    <div class="card-body">
                        <div class="control-row">
                            <input type="text" id="faceNameInput" placeholder="Enter name" class="input-field">
                            <button onclick="registerFace()" class="btn btn-small btn-success">Register</button>
                        </div>
                        <button onclick="recognizeFace()" class="btn btn-small btn-primary full-width">
                            <i class="fas fa-face-smile"></i> Who is in front?
                        </button>
                        <div id="faceResults" class="results-box"></div>
                    </div>
                </div>

                <!-- Text Recognition (OCR) -->
                <div class="feature-card">
                    <div class="card-header">
                        <h3><i class="fas fa-text-height"></i> Text Recognition</h3>
                    </div>
                    <div class="card-body">
                        <button onclick="readText()" class="btn btn-small btn-info full-width">
                            <i class="fas fa-file-alt"></i> Read Text
                        </button>
                        <div id="textResults" class="results-box"></div>
                    </div>
                </div>

                <!-- Navigation -->
                <div class="feature-card">
                    <div class="card-header">
                        <h3><i class="fas fa-location-dot"></i> Navigate To</h3>
                    </div>
                    <div class="card-body">
                        <input type="text" id="locationInput" placeholder="Enter location" class="input-field" list="locations">
                        <datalist id="locations">
                            <option value="Hospital">
                            <option value="Police Station">
                            <option value="Restaurant">
                            <option value="Shopping Mall">
                            <option value="Park">
                        </datalist>
                        <button onclick="navigateTo()" class="btn btn-small btn-success full-width">
                            <i class="fas fa-map-location-dot"></i> Start Route
                        </button>
                        <div id="navResults" class="results-box"></div>
                    </div>
                </div>

                <!-- Registered Faces List -->
                <div class="feature-card">
                    <div class="card-header">
                        <h3><i class="fas fa-users"></i> Registered Faces (<span id="registeredFacesCount">0</span>)</h3>
                    </div>
                    <div class="card-body">
                        <div id="registeredFacesList" class="faces-list"></div>
                    </div>
                </div>

                <!-- SOS Button -->
                <button id="sosBtn" class="btn btn-danger full-width sos-button" onclick="triggerSOS()">
                    <i class="fas fa-bell-slash"></i> <strong>SOS EMERGENCY</strong>
                </button>
            </section>
        </div>

        <!-- Modal for Messages -->
        <div id="messageModal" class="modal">
            <div class="modal-content">
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <div id="messageText" class="message-text"></div>
                <button onclick="closeModal()" class="btn btn-primary">Close</button>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast"></div>
    </div>

    <script src="{{ url_for('static', filename='maps.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
